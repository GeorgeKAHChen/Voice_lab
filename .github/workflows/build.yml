name: build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: make analyze
      - run: make test

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: make macos-dmg
      - uses: actions/upload-artifact@v4
        with: { name: amakawa-macos, path: build/amakawa-macos.dmg }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with: { name: amakawa-windows, path: build/amakawa-windows-x64.zip }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: make android
      - uses: actions/upload-artifact@v4
        with: { name: amakawa-android, path: build/app/outputs/flutter-apk/app-release.apk }
