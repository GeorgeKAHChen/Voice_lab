name: amakawa
description: "amakawa: real-time voice monitor with spectrum and pitch analysis, recording and replay."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  amakawa_core:
    path: packages/amakawa_core
  path_provider: ^2.1.5
  path: ^1.9.0
  permission_handler: ^12.0.0
  shared_preferences: ^2.5.0
  share_plus: ^12.0.0
  flutter_foreground_task: ^11.0.3
  audio_session: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
